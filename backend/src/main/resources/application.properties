spring.application.name=ecommerce-backend

# ---- Database (Render will inject these via environment variables) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndRandomInProduction123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS: your Netlify frontend URL goes here in production ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Server ----
server.port=${PORT:8080}
